[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alignforge"
description = "LLM post-training pipeline: QLoRA SFT, DPO alignment, judge-based evaluation, and serving."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "jyotishman", email = "jyotishmann@gmail.com" }]
keywords = ["llm", "fine-tuning", "qlora", "dpo", "rlhf", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
# Version is read from src/alignforge/__init__.py — single source of truth.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/jyotishmann/alignforge"
Repository = "https://github.com/jyotishmann/alignforge"

# The single console entry point. Everything is a subcommand of this.
[project.scripts]
alignforge = "alignforge.cli:app"

[tool.hatch.version]
path = "src/alignforge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/alignforge"]

# Base install: config, validation, logging, CLI. Deliberately no ML deps.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Dataset curation: loading, filtering, dedup, parquet.
data = [
    "datasets>=2.19",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "sentence-transformers>=3.0",
    "datasketch>=1.6",
    "scikit-learn>=1.5",
]

# Training: QLoRA SFT and DPO. Installed on the GPU box / Colab only.
train = [
    "torch>=2.3",
    "transformers>=4.44",
    "accelerate>=0.33",
    "peft>=0.12",
    "trl>=0.10",
    "bitsandbytes>=0.43",
    "datasets>=2.19",
    "sentencepiece>=0.2",
]

# Evaluation: judging, statistics, figures.
eval = [
    "numpy>=1.26",
    "scipy>=1.13",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "jinja2>=3.1",
]

# Serving: the FastAPI inference API. No torch — EchoEngine and OllamaEngine
# need nothing heavier than httpx.
serve = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

# The Gradio frontend. Depends on nothing from train/ or eval/ — see ADR-007.
ui = [
    "gradio>=4.40",
    "httpx>=0.27",
    "plotly>=5.22",
]

# Toolchain.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort — import ordering
    "N",         # pep8-naming
    "UP",        # pyupgrade — modern syntax
    "B",         # bugbear — real bug patterns
    "C4",        # comprehensions
    "SIM",       # simplification
    "PTH",       # prefer pathlib over os.path
    "RUF",       # ruff-specific
]
ignore = [
    "E501",   # line length is handled by the formatter, not the linter
    "B008",   # function call in default arg — required by Typer's Option()
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert freely and skip some naming rules.
"tests/**" = ["N802", "N806"]
# Notebooks-as-scripts under scripts/ may print.
"scripts/**" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["alignforge"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src/alignforge", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

# Third-party ML libraries ship incomplete stubs. Don't fight them.
[[tool.mypy.overrides]]
module = [
    "transformers.*", "peft.*", "trl.*", "datasets.*", "bitsandbytes.*",
    "torch.*", "accelerate.*", "sentence_transformers.*", "datasketch.*",
    "gradio.*", "plotly.*", "sklearn.*", "scipy.*", "matplotlib.*",
]
ignore_missing_imports = true

# Tests get slightly looser rules — fixtures are hard to type precisely.
[[tool.mypy.overrides]]
module = ["flash_attn", "flash_attn.*", "tests.*"]
disallow_untyped_decorators = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "slow: takes more than a few seconds",
    "gpu: requires a CUDA device",
    "integration: requires external services (Ollama, network)",
]
filterwarnings = ["error::DeprecationWarning:alignforge.*"]

[tool.coverage.run]
source = ["src/alignforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
