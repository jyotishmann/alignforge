# DPO smoke test: verifies the pipeline on CPU in ~3 minutes.
# Use: alignforge train dpo --config configs/train/dpo_smoke.yaml --limit 20
dpo:
  beta: 0.1
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-6
  logging_steps: 1
  save_steps: 5
  max_prompt_length: 256
  max_length: 512
  gradient_checkpointing: false
