# QLoRA SFT configuration for the T4 (16GB).
# Merged after base.yaml and the model config; CLI --set overrides applied last.

sft:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4       # effective batch = 4 × 4 = 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  optim: "paged_adamw_8bit"            # pages optimizer states to CPU under memory pressure
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 200
  eval_steps: 100
  packing: false                        # off — packing + completion-only mask interact badly
  completion_only: true                 # only compute loss on the assistant response tokens

# Merge this config after model config to override model-specific defaults.
