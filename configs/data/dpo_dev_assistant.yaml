# DPO preference dataset for the developer support assistant domain.
data:
  name: dev_assistant_dpo_v1
  kind: preference
  sources:
    - ultrafeedback
    - py_dpo
    # - anthropic_hh   # general harmlessness chat; adds noise for a dev-assistant domain
  max_seq_len: 1024
  val_ratio: 0.05
  dedup_jaccard: 0.85
  decontaminate: true
  decontaminate_ngram: 13
  domain_threshold: 0.25   # lowest value whose newly admitted rows stayed on-topic (sweep 2026-10-08)
